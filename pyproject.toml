[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmedit"
version = "0.1.0"
description = "A multi-turn image-editing agent with bundled model inference"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "diffusers>=0.38.0",
    "google-genai>=2.26.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "smolagents>=1.26.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0.dev0",
    "tqdm>=4.70.1",
    "bitsandbytes>=0.50.2",
    "sentencepiece>=0.2.2",
    "huggingface-hub>=1.33.0",
    "protobuf>=7.36.2",
    "torchaudio>=2.11.0",
    "safetensors>=0.8.0",
    "torchmetrics>=1.9.0",
]

[project.optional-dependencies]
models = [
    "accelerate>=1.12.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git",
    "huggingface-hub>=0.36.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "safetensors>=0.5.3",
    "scipy>=1.15.3",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers @ git+https://github.com/huggingface/transformers.git",
]
benchmark = [
    "datasets>=3.0.0",
]
metrics = [
    "torchmetrics[multimodal]>=1.0",
]
visualize = [
    "ipywidgets>=8.1.0",
    "pandas>=3.0.6",
    "scikit-image>=0.25.2",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.setuptools.packages.find]
where = ["src"]
include = ["annotation*", "evaluation*", "framework*", "scripts*", "visualization*"]

[tool.setuptools.package-data]
"framework.inference" = ["objectclear/LICENSE"]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git" }
